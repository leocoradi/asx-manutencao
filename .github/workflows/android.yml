name: Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TEM_CHAVE: ${{ secrets.MAPS_API_KEY != '' && 'sim' || 'nao' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      # O runner ubuntu-latest já tem o SDK em $ANDROID_HOME; o AGP baixa platform e build-tools que faltarem.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.4.1' }
      # Assinatura estável (opcional): secrets ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_SENHA, ANDROID_CHAVE, ANDROID_CHAVE_SENHA.
      # Sem eles o APK sai com a chave de debug do runner e atualizar exige desinstalar.
      - name: Keystore
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_B64 }}' }
        if: env.KS != ''
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/asx.jks"
          echo "ASX_KEYSTORE=$RUNNER_TEMP/asx.jks" >> "$GITHUB_ENV"
          echo "ASX_KEYSTORE_SENHA=${{ secrets.ANDROID_KEYSTORE_SENHA }}" >> "$GITHUB_ENV"
          echo "ASX_CHAVE=${{ secrets.ANDROID_CHAVE }}" >> "$GITHUB_ENV"
          echo "ASX_CHAVE_SENHA=${{ secrets.ANDROID_CHAVE_SENHA }}" >> "$GITHUB_ENV"
      # MAPS_API_KEY (opcional): chave do Google com o Navigation SDK ativado. Com ela o APK traz o mapa nativo.
      - run: gradle -p android assembleRelease --no-daemon
        env: { MAPS_API_KEY: '${{ secrets.MAPS_API_KEY }}' }
      - run: cp android/app/build/outputs/apk/release/app-release.apk asx-manutencao.apk
      # Sem chave embutida o APK é público como artefato. Com chave, vai para um rascunho de release,
      # que só quem tem acesso de escrita ao repositório consegue baixar.
      - uses: actions/upload-artifact@v4
        if: env.TEM_CHAVE != 'sim'
        with: { name: asx-manutencao-apk, path: asx-manutencao.apk }
      - name: APK com chave em rascunho de release
        if: env.TEM_CHAVE == 'sim'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete apk-privado --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create apk-privado asx-manutencao.apk --draft --repo "$GITHUB_REPOSITORY" \
            --title "APK com mapa nativo (privado)" --notes "Gerado em $(date -u +%F) do commit $GITHUB_SHA. Contém a chave do Google: não publique este rascunho."
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') && env.TEM_CHAVE != 'sim'
        with: { files: asx-manutencao.apk }
