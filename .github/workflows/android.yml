name: Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TEM_CHAVE: ${{ secrets.MAPS_API_KEY != '' && 'sim' || 'nao' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      # O runner ubuntu-latest já tem o SDK em $ANDROID_HOME; o AGP baixa platform e build-tools que faltarem.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.4.1' }
      # Assinatura fixa: o Android só aceita atualizar um app com APK assinado pela mesma chave.
      # A chave é gerada no primeiro build e guardada num rascunho de release "assinatura", que só
      # quem tem escrita no repositório vê. Não apague nem publique esse rascunho: sem ele, o app
      # instalado deixa de aceitar atualizações e é preciso desinstalar uma vez.
      - name: Assinatura
        env: { GH_TOKEN: '${{ github.token }}', SENHA: asx-manutencao }
        run: |
          R="$GITHUB_REPOSITORY"; K="$RUNNER_TEMP/assinatura.p12"
          if gh release download assinatura -p assinatura.p12 -D "$RUNNER_TEMP" --repo "$R"; then
            echo "Chave de assinatura recuperada."
          elif gh release list --repo "$R" --json tagName -q '.[].tagName' | grep -qx assinatura; then
            echo "::error::O rascunho 'assinatura' existe, mas a chave não foi baixada. Nenhuma chave nova foi criada."; exit 1
          else
            keytool -genkeypair -keystore "$K" -storetype PKCS12 -alias asx -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$SENHA" -keypass "$SENHA" -dname "CN=ASX Manutencao"
            gh release create assinatura "$K" --draft --repo "$R" --title "Assinatura do APK (não apagar, não publicar)" \
              --notes "Chave que assina todos os APKs. Apagar ou publicar este rascunho quebra as atualizações do app instalado."
          fi
          { echo "ASX_KEYSTORE=$K"; echo "ASX_KEYSTORE_SENHA=$SENHA"; echo "ASX_CHAVE=asx"; echo "ASX_CHAVE_SENHA=$SENHA"; } >> "$GITHUB_ENV"
      # MAPS_API_KEY (opcional): chave do Google com o Navigation SDK ativado. Com ela o APK traz o mapa nativo.
      - run: gradle -p android assembleRelease --no-daemon
        env: { MAPS_API_KEY: '${{ secrets.MAPS_API_KEY }}' }
      - run: cp android/app/build/outputs/apk/release/app-release.apk asx-manutencao.apk
      # Sem chave embutida o APK é público como artefato. Com chave, vai para um rascunho de release,
      # que só quem tem acesso de escrita ao repositório consegue baixar.
      - uses: actions/upload-artifact@v4
        if: env.TEM_CHAVE != 'sim'
        with: { name: asx-manutencao-apk, path: asx-manutencao.apk }
      - name: APK com chave em rascunho de release
        if: env.TEM_CHAVE == 'sim'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete apk-privado --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create apk-privado asx-manutencao.apk --draft --repo "$GITHUB_REPOSITORY" \
            --title "APK com mapa nativo (privado)" --notes "Gerado em $(date -u +%F) do commit $GITHUB_SHA. Contém a chave do Google: não publique este rascunho."
      # Builds do main viram a release mais nova, que o botão "Procurar atualização" do app baixa.
      - name: Publicar versão
        if: github.ref == 'refs/heads/main' && env.TEM_CHAVE != 'sim'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "apk-$GITHUB_RUN_NUMBER" asx-manutencao.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --latest --title "App 1.$GITHUB_RUN_NUMBER" --notes "$(git log -1 --format=%s)"
